<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Expense Tracker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:#0f172a;
}

/* Splash Screen */
#splash{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top left,#0f172a,#111827 70%);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    color:white;
}

/* Floating Money Glow */
.glow1,.glow2{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.35;
    animation:float 6s ease-in-out infinite;
}

.glow1{
    width:220px;
    height:220px;
    background:#10b981;
    top:10%;
    left:15%;
}

.glow2{
    width:250px;
    height:250px;
    background:#22c55e;
    bottom:10%;
    right:15%;
    animation-delay:2s;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-30px);}
}

/* Glass Card */
.card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:42px 34px;
    border-radius:28px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    animation:fadeUp 1s ease forwards;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Logo */
.logo{
    width:95px;
    height:95px;
    border-radius:26px;
    margin:auto;
    margin-bottom:22px;
    background:linear-gradient(135deg,#10b981,#22c55e);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    box-shadow:0 10px 35px rgba(16,185,129,.35);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
}

h1{
    font-size:28px;
    font-weight:700;
    letter-spacing:.4px;
}

p{
    margin-top:8px;
    color:#cbd5e1;
    font-size:14px;
}

/* Progress Loader */
.loader{
    margin:28px auto 0;
    width:180px;
    height:8px;
    border-radius:50px;
    background:rgba(255,255,255,.08);
    overflow:hidden;
}

.loader span{
    display:block;
    height:100%;
    width:40%;
    border-radius:50px;
    background:linear-gradient(90deg,#10b981,#22c55e);
    animation:loading 1.4s infinite ease-in-out;
}

@keyframes loading{
    0%{margin-left:-40%;}
    100%{margin-left:100%;}
}

/* Bottom text */
.bottom{
    position:absolute;
    bottom:28px;
    font-size:12px;
    color:#94a3b8;
    letter-spacing:1px;
}

/* Fade Out */
.fade-out{
    animation:fadeOut .6s ease forwards;
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}
</style>
</head>

<body>

<div id="splash">

    <div class="glow1"></div>
    <div class="glow2"></div>

    <div class="card">
        <div class="logo">💰</div>
        <h1>Expense Tracker</h1>
        <p>Organize your spending. Build savings.</p>

        <div class="loader">
            <span></span>
        </div>
    </div>

    <div class="bottom">Smart Budgeting Experience</div>

</div>

<script>
window.onload = function() {
   setTimeout(() => {
      document.getElementById("splash").classList.add("fade-out");
      setTimeout(() => {
         document.getElementById("splash").remove();
      }, 700);
   }, 2200);
};
</script>

<script src="flutter_bootstrap.js"></script>

</body>
</html>
